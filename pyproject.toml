[project]
name = "job-intel-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1",
    "uvicorn[standard]>=0.27,<1",
    "anthropic>=0.42,<1",
    "openai>=1.58,<2",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
